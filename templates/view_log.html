{% extends "base.html" %}

{% block title %}View Log - {{ filename }}{% endblock %}

{% block content %}
<h1>Log: {{ filename }}</h1>

<pre style="background-color: #f4f4f4; padding: 10px; border: 1px solid #ddd;">
{{ content }}
</pre>

<a href="{{ url_for('logs') }}">Back to Logs</a>
{% endblock %}
