{% extends "base.html" %}

{% block title %}Logs{% endblock %}

{% block content %}
<h1>Logs</h1>

<!-- Filter Form -->
<form method="GET" action="{{ url_for('logs') }}">
  <input type="text" name="filter" placeholder="Filter logs..." value="{{ request.args.get('filter', '') }}">
  <button type="submit">Filter</button>
</form>

<!-- Logs Table -->
<table>
  <thead>
    <tr>
      <th>Filename</th>
    </tr>
  </thead>
  <tbody>
    {% for log in logs %}
      <tr>
        <td><a href="{{ url_for('view_log', filename=log.name) }}">{{ log.name }}</a></td>
        <td>
          <form method="POST" action="{{ url_for('logs') }}" style="display: inline;">
            <input type="hidden" name="filename" value="{{ log.name }}">
            <input type="hidden" name="action" value="delete">
            <button type="submit" onclick="return confirm('Are you sure you want to delete this log?')">Delete</button>
          </form>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>

<script>
  document.querySelectorAll('form[action="{{ url_for("logs") }}"]').forEach(form => {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const response = await fetch(form.action, {
        method: 'POST',
        body: formData
      });
      const result = await response.json();
      if (result.success) {
        alert(result.message);
        location.reload();
      } else {
        alert(result.message);
      }
    });
  });
</script>
{% endblock %}
