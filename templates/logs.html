{% extends "base.html" %}

{% block title %}Logs{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

<h1>Logs</h1>

<!-- Logs Table -->
<table id="logs-table">
  <thead>
    <tr>
      <th>Filename</th>
      <th>Datetime</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for log in logs %}
      <tr>
        <td><a href="{{ url_for('logs.view_log', filename=log.name) }}">{{ log.name }}</a></td>
        <td>{{ log.timestamp.strftime('%Y-%m-%d %H:%M') if log.timestamp else 'N/A' }}</td>
        <td>
          <form method="POST" action="{{ url_for('logs.logs') }}" style="display: inline;">
            <input type="hidden" name="filename" value="{{ log.name }}">
            <input type="hidden" name="action" value="delete">
            <button type="submit" onclick="return confirm('Are you sure you want to delete this log?')">Delete</button>
          </form>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>

<script>
    document.querySelectorAll('form[action="{{ url_for("logs.logs") }}"]').forEach(form => {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const response = await fetch("/logs", {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (result.success) {
                alert(result.message);
                location.reload();
            } else {
                alert(result.message);
            }
        });
    });

    $(document).ready(function () {
      $('#logs-table').DataTable({
        order: [[1, 'desc']], // Sort by the Datetime column (index 1) in descending order
        columnDefs: [
          { orderable: false, targets: 2 } // Disable sorting for the Actions column
        ],
        pageLength: 10, // Number of entries to show per page,
        lengthChange: true, // Allow user to change the number of entries shown
        pagingType: "full_numbers", // Show full pagination controls
        searching: true, // Enable search functionality
      });
    });
</script>

<style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
  
    tbody tr:nth-child(odd) {
      background-color: #f9f9f9;
    }
  
    tbody tr:nth-child(even) {
      background-color: #e9e9e9;
    }
  
    td {
      padding: 8px;
    }
  
    td:last-child {
      text-align: right;
    }
  </style>
{% endblock %}
