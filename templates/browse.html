{% extends "base.html" %}

{% block title %}Browse - V.E.R.A.{% endblock %}

{% block content %}
<h1 class="mb-4">Your Wardrobe</h1>
<div class="row">
  {% for item in items %}
    <div class="col-md-4 mb-4">
      <div class="card">
        <img src="{{ item.image_path }}" class="card-img-top" style="object-fit: cover; height: 250px;">
        <div class="card-body">
          <h5 class="card-title">{{ item.name }}</h5>
          <p class="card-text text-muted">{{ item.type }}</p>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
