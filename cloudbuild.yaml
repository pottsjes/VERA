steps:
  - name: 'Build'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vera', '.']

  - name: 'Push'
    args: ['push', 'gcr.io/$PROJECT_ID/vera']

  - name: 'Deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vera'
      - '--image=gcr.io/$PROJECT_ID/vera'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=vera-494519:us-central1:vera-db'
      - '--set-env-vars=GCS_BUCKET=vera-wardrobe-images'
      - '--set-secrets=DB_PASS=${_DB_PASS}:latest'
      - '--set-secrets=ANTHROPIC_API_KEY=${_ANTHROPIC_KEY}:latest'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/vera'
