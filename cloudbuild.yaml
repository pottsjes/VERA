steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/vera', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/vera']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vera'
      - '--image=gcr.io/$PROJECT_ID/vera'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=vera-494519:us-central1:vera-db'
      - '--set-env-vars=DB_PASS=${_DB_PASS},GCS_BUCKET=vera-wardrobe-images,ANTHROPIC_API_KEY=${_ANTHROPIC_KEY}'

images:
  - 'gcr.io/$PROJECT_ID/vera'
