services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vera
      POSTGRES_PASSWORD: vera
      POSTGRES_DB: vera
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://vera:vera@db:5432/vera
      GCS_BUCKET: ""
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/application_default_credentials.json
      GCP_PROJECT: vera-494519
    depends_on:
      - db
    volumes:
      - ./wardrobe:/app/wardrobe
      - ~/.config/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro

volumes:
  pgdata:
